name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: nexo
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo-local-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexo -d nexo"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r apps/api/requirements.txt
      - run: python -m compileall -q apps/api/nexo apps/api/migrations
      - run: python -m pytest apps/api/tests -q
