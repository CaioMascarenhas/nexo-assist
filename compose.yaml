services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - nexo-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nexo -d nexo"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: [sh, -c, "alembic upgrade head && python -m nexo.seed"]
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://nexo:${POSTGRES_PASSWORD}@db:5432/nexo
      AGENT_URL: http://agent:4111
      INTERNAL_AGENT_SECRET: ${INTERNAL_AGENT_SECRET:?set internal agent secret}
      SERVICE_DESK_TIMEZONE: ${SERVICE_DESK_TIMEZONE:-America/Fortaleza}
      TICKET_FAILURE_MODE: ${TICKET_FAILURE_MODE:-off}
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      agent:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    environment:
      INTERNAL_AGENT_SECRET: ${INTERNAL_AGENT_SECRET}
      LLM_MODE: ${LLM_MODE:-stub}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-google/gemini-3.8-flash}
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:4111/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy
volumes:
  nexo-data:
